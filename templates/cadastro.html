{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}
{% block content %}
    <h2>Criar conta</h2>

    {% if erro %}
        <p class="alerta alerta-erro">{{ erro }}</p>
    {% endif %}
    {% if sucesso %}
        <p class="alerta alerta-sucesso">{{ sucesso }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('cadastro') }}" novalidate>
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required>

        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" minlength="6" required>

        <label for="confirmar_senha">Confirmar senha</label>
        <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="6" required>

        <button type="submit">Cadastrar</button>
    </form>

    <p class="link-secundario">
        Já tem conta? <a href="{{ url_for('login') }}">Faça login</a>
    </p>
{% endblock %}
{% block scripts %}
    <script src="{{ url_for('static', filename='js/validacao.js') }}"></script>
{% endblock %}
